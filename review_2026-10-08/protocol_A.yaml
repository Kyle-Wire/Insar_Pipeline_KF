  # ---------------------------------------------------------------------------
  # Amendments of the protocol decisions of 8 Oct 2026 (HANDOFF.md, "8 Oct:
  # validation experiments - phases 2 and 3", decisions 1, 2, 4, 5, 6 and 7).
  # Kyle delegated these decisions; Claude made them for him on 8 Oct 2026,
  # BEFORE any A run had started, any experiment data had been downloaded or
  # any comparison output existed. Nothing above is changed. Ids follow the
  # decision numbers there (p23-N).
  # ---------------------------------------------------------------------------
  - id: "2026-10-08/p23-1"
    date: "2026-10-08"
    decided_by: "Claude for Kyle (delegated 8 Oct)"
    before_any_result: true
    amends: "truth.tahmoor_west_units.digitising, its 'at least the plot's half-gridline'"
    decision: >-
      The digitising error of each Tahmoor West unit-epoch, per component, is
      sqrt(r^2 + w^2 + c^2). r is the measured digitising repeatability: the
      RMS of pass A minus pass B over the unit's listed epochs. w is half the
      plotted line width in data units: half the stroke width of the 7-day
      average curve that was read (pt) times the value axis's mm per pt. c is
      the axis-calibration residual at that point: the value axis's RMS at its
      labelled ticks, in quadrature with the date axis's RMS (days) times the
      curve's slope at the epoch (mm per day). This replaces the half-gridline
      floor. The truth sigma is still sqrt(digitising error^2 + the unit's own
      daily scatter^2). The CSV keeps the floor's figures (half_gridline_*,
      sigma_*_as_first_fixed_mm) for the protocol as first fixed.
    reason: >-
      Read as written, the floor set the digitising error to 10-50 mm (half of
      20-100 mm gridlines) against a measured 0.1-1.0 mm. The figures are
      vector drawings: every plotted value is a vertex, read exactly, so the
      gridline spacing does not limit the reading; the drawn line, the axis
      calibration and the two passes' disagreement do. With the floor the
      units' 95% interval was about 30-140 mm, so the uncertainty part of the
      route rule (amendment 2026-10-08/1), where the units far outnumber
      CA19's 2 event changes, would pass almost whatever the InSAR did (phase
      2/3 decision 1). Measured on the 17 figures (truth/ rebuilt 8 Oct 2026;
      the values, dates, positions and every other file are byte for byte as
      before): the 7-day line is 0.504 pt wide in every figure, half of it
      0.15-1.33 mm; calibration 0.00-0.51 mm; digitising error 0.25-1.57 mm;
      Up sigma 2.2-4.1 mm (median 3.2; it was 10.2-50.1). No result existed.
    harness:
      digitised_sigma: hypot_repeatability_line_calibration

  - id: "2026-10-08/p23-2"
    date: "2026-10-08"
    decided_by: "Claude for Kyle (delegated 8 Oct)"
    before_any_result: true
    amends: "comparisons.unflagged_failure_rate: the coherence hole of flag_definition, and the row's grade"
    decision: >-
      (a) The coherence hole is relative to the ground around it, not an
      absolute low. A cell is in a hole in an interferogram when its pair
      coherence, averaged over the 3 x 3 look cells centred on it, is at most
      2/pi (0.637) of the median pair coherence of the reliable cells 1-3 km
      around it in the same interferogram, where at least 10 such cells exist
      and their median is at least 0.4. The stated margin: the cell kept at
      most 64% of its ring's coherence. The gradient part of the flag is
      unchanged; as F2 measures it (over 3 x 3 look cells, counted only where
      the gradient is consistent, >= 0.7, or pure noise's 99.9th percentile
      with few looks; both chosen on Francisco still ground before any A data)
      it is stricter than the words "per look cell", and is stated here.
      (b) The row can pass only if the flag is selective. On the stable-ground
      placements of amendment 2026-10-08/1 (the stable ring; the reference
      area without the T1 outlines), the share of placements the flag marks,
      taken over the row's own intervals, must be at most 20%: each
      comparison that is not masked contributes the share of placements
      flagged for its interval (a placement is flagged as a point is, when at
      least half of its reliable cells are), and the shares are averaged over
      the comparisons, as the row counts them. Above 20% the row reads 'flag
      not selective' and fails, whatever its rate. When the share cannot be
      measured the row cannot pass or be marginal (not testable); a failing
      rate still fails. The share, the limit and the truth points' own flagged
      share are reported beside the row.
    reason: >-
      As first worded the hole was any cell below 0.4 while the ring's median
      reached 0.4. On Francisco farmland (2019, 81 pairs, read only) it
      flagged 19% of the crop per pair and 93% over the year, so the row could
      pass by flagging nearly everything (phase 2/3 decision 2). 2/pi =
      sinc(1/2): a phase ramp of half a cycle across a look cell, the
      protocol's own aliasing limit, multiplies the cell's coherence by 0.64,
      so a cell that kept less lost at least what that gradient costs,
      whatever the season's level; the 3 x 3 average is the support of the
      gradient test. The ring must itself reach 0.4, as first written, so a
      scene-wide low flags nothing. The 20% limit: a flag blind to where the
      errors are marks a share f of the comparisons at random and so lowers
      the unflagged-failure rate by the factor (1 - f) by itself. At f = 0.20
      it can bring a rate of at most 0.125 to the 0.10 pass and of at most
      0.3125 to the 0.25 marginal bound, a shift of 0.025 at the pass bound,
      below the row's own sampling uncertainty (binomial 95% half-width about
      0.04 at a rate of 0.10 over 200 comparisons). Stable ground has nothing
      to alias, so the share flagged there is the flag's false-alarm rate. The
      ratio and the limit were fixed before the Francisco figures were
      computed. On Francisco 2019 (read only, review_2026-10-08/protdec/) the
      amended hole flags a median 9.4% of the crop per pair (was 19%), 23% per
      interval between consecutive dates (was 48%) and 67% over the year (was
      93%): on farmland like Francisco's the flag is still not selective at
      this limit, and the row would say so. No result existed.
    harness:
      coherence_hole: relative_to_ring
      coherence_hole_ratio: 0.6366
      coherence_hole_block_look_cells: 3
      flag_selectivity_max_stable_share: 0.20

  - id: "2026-10-08/p23-4"
    date: "2026-10-08"
    decided_by: "Claude for Kyle (delegated 8 Oct)"
    before_any_result: true
    amends: "truth.tahmoor_west_units and comparisons.tahmoor_w_units, for unit TW_G13 (Site 13)"
    decision: >-
      Site 13's rows dated on or after 2022-03-28 are scored as a separate
      unit, TW_G13b, with its own datum: its first epoch on or after that date
      (2022-04-01) is its zero, as any unit's first epoch is. No change that
      spans the gap is ever formed: TW_G13's rows before the gap keep their
      own datum, and TW_G13b's never refer to them. Both are validation
      points.
    reason: >-
      Report 8's Fig. G13 says the unit was disturbed in early January 2022,
      relocated on 28 March 2022 and its "results normalised"; its record has
      no data from 10 January to 29 March 2022. MSEC joined the later values
      to the earlier ones, so movement during the 11-week gap is not measured,
      and a change across it would compare the InSAR with that join, not with
      the ground (phase 2/3 decision 4). The split keeps the 18 rows after the
      relocation inside the window (2022-04-01 .. 2022-12-15) without bridging
      the gap. The CSV gives the relocated position for both (the only circle
      drawn); how far the unit moved is not stated. No result existed.
    harness:
      unit_splits:
        - {id: TW_G13, from: "2022-03-28", as: TW_G13b}

  - id: "2026-10-08/p23-5"
    date: "2026-10-08"
    decided_by: "Claude for Kyle (delegated 8 Oct)"
    before_any_result: true
    amends: "runs.A5.role ('C-vs-L consistency and aliasing, F4'): the frames of F4's two statistics"
    decision: >-
      F4 (python -m insar_pipeline.lband) reports two statistics, each in its
      own frame, always both. (1) The cycle-consistency (aliasing) test stays
      in C-band LOS: the NISAR change is projected into C-band's LOS under the
      stated vertical-motion assumption (d_C = d_L x up_C / up_L per cell; from
      D1's L-band Up and East when they are given), and a whole-cycle
      difference is one within 5 mm of a non-zero multiple of C-band's half
      wavelength (27.7 mm). (2) The accuracy comparison (the share of cells
      whose difference is below 15 mm, and its spread) is in vertical: each
      sensor's LOS change divided by cos of its own incidence, both labelled
      'assumes vertical motion'. A5 stays exploratory, with no verdict.
    reason: >-
      A missed C-band cycle is a whole cycle only in C-band's LOS (27.7 mm
      there is 27.7 / up_C, about 35 mm, in Up), so the aliasing fingerprint
      must be read there. Agreement between two sensors with different look
      sides and incidences is a statement about the ground, which the
      protocols read in vertical. Reporting both keeps each statistic in the
      frame where it means something (phase 2/3 decision 5). No result
      existed.
    harness:
      lband_cycle_frame: c_band_los_vertical_motion_assumed
      lband_accuracy_frame: vertical_each_sensor_own_incidence

  - id: "2026-10-08/p23-6"
    date: "2026-10-08"
    decided_by: "Claude for Kyle (delegated 8 Oct)"
    before_any_result: true
    amends: "verdict.route_trustworthy_for_longwall and comparisons.unflagged_failure_rate, for run A2"
    decision: >-
      A2 (OPERA DISP-S1 through disp_record_chain) gets an accuracy verdict
      only: the route rule read without its honest-or-flagged part and
      without the rows the protocol does not run on A2 (tahmoor_w_units runs
      on A1, A3 and D1), that is ca19_lw902 PASS, with bias and uncertainty
      calibration read as for A1. It is labelled "honesty not assessable
      (OPERA unwraps its own pairs; no per-pair aliasing record)". A2's
      unflagged_failure_rate row is computed and reported under that label,
      not graded. A2's verdict never reads 'trustworthy for longwall'.
    reason: >-
      OPERA unwraps its own interferograms, so F2, which measures each pair
      before snaphu, has no record for A2, and the honest-or-flagged row could
      use only the old lower-bound flag, which does not grade: A2 could never
      reach a verdict (phase 2/3 decision 6). Its accuracy against CA19 is
      still worth one, as long as it says what it does not cover. No result
      existed.
    harness:
      accuracy_only_verdict:
        A2: "honesty not assessable (OPERA unwraps its own pairs; no per-pair aliasing record)"

  - id: "2026-10-08/p23-7"
    date: "2026-10-08"
    decided_by: "Claude for Kyle (delegated 8 Oct)"
    kind: "record only: no rule, threshold, station role or radius changes"
    before_any_result: true
    amends: "nothing: it states readings the harness already makes where the protocol is silent"
    decision: >-
      Where the protocol is silent the harness reads it so: (a) a matched
      epoch of ca19_series is flagged over the whole series' span, because its
      error is a residual after one offset fitted over every compared epoch;
      (b) appin_peak_ratio reads the lowest panel-line's grade: every
      panel-line must pass; (c) in the honest-or-flagged row a line maximum's
      error is the InSAR peak's shortfall against it (0 when the InSAR is
      deeper), because line maxima are lower bounds; (d) the peaks
      (appin_peak_ratio, tahmoor_w_peak_ratio) use LOS / cos(incidence),
      labelled, double-differenced to the reference station, not D1 Up, even
      at LW903 and LW904 where D1 exists (D1 Up is not read along lines); (e)
      the Tahmoor West peak is the deepest robust value over the run's whole
      window inside every outline named W1..W4, the planned W4 outline
      (TW_W4_planned) included, not over each panel's own dates; (f) GA's
      formal sigma (amendment 2026-10-08/4) is the median of its stated daily
      sigmas in the window; (g) without the per-pair aliasing record, the
      whole-record quality_aliasing_risk.tif stands in for the per-interval
      flag and still grades, with a warning, as in phase 1.
    reason: >-
      Phase 2/3 decision 7: the groups' readings are accepted and recorded, so
      that the protocol states them. No result existed.
    harness:
      readings_recorded: [matched_epoch_flag_over_series_span, appin_row_lowest_panel_line,
                          line_max_error_is_shortfall, peaks_los_over_cos_incidence,
                          tahmoor_peak_over_run_window_all_w_outlines, ga_formal_sigma_median_stated,
                          whole_record_tif_fallback_grades_with_warning]
