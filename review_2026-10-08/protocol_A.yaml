  # ---------------------------------------------------------------------------
  # Record-only amendments of the phase 2/3 finishing pass (8 Oct 2026), made
  # BEFORE any A run had started, any experiment data had been downloaded or
  # any comparison output existed. They change no rule, threshold, station role
  # or radius. They were made by the finishing pass, not decided by Kyle: to
  # undo one, delete it here and put the configs back as its text says.
  # ---------------------------------------------------------------------------
  - id: "2026-10-08/a-deramp-polygon"
    date: "2026-10-08"
    kind: "record only: no rule, threshold, station role or radius changes"
    before_any_result: true
    amends: "site.deforming_area_approx, the polygon the A runs keep out of the deramp fit, far field and reference-pixel rule"
    decision: >-
      The A1, A2 and A3 configs name
      configs/experiments/context/appin_tahmoor_deforming.geojson as their
      deramp_exclude_geojson instead of the APPROX envelopes. It is built by
      the APPROX file's rule from the panel outlines digitised in T1
      (review_2026-10-08/truth/panels.geojson): every panel mined, or
      completed in the six months before the window and so still settling, in
      2017-11-01 .. 2022-12-31, buffered by its angle of draw (tan 26.5 deg x
      its depth of cover) plus 50 m. The runs add deramp_buffer_m (2 km) as
      before. The APPROX file is kept. Every panel-based statistic already
      used the T1 outlines, so no graded quantity changes.
    reason: >-
      The T1 outlines were digitised on 8 Oct 2026, before any A run had
      started, so using them is a choice of run design, not a re-run. The
      hand-drawn envelopes missed part of LW S1A and LW708B themselves and
      excluded about 185 km2 against 23 km2; with the digitised polygon the
      deramp fits on 85% of the processed crop instead of 59%, with 21-29% in
      each quadrant (review_2026-10-08/truth/README.md). To undo: delete this
      amendment and point the three configs' deramp_exclude_geojson back at
      context/appin_tahmoor_deforming_APPROX.geojson.
    harness:
      run_deramp_polygon:
        A1: configs/experiments/context/appin_tahmoor_deforming.geojson
        A2: configs/experiments/context/appin_tahmoor_deforming.geojson
        A3: configs/experiments/context/appin_tahmoor_deforming.geojson

  - id: "2026-10-08/nisar-configs"
    date: "2026-10-08"
    kind: "record only: no rule, threshold, station role or radius changes"
    before_any_result: true
    amends: "runs.A5.config, which read 'not written yet (needs M1, M2)'"
    decision: >-
      A5 is three projects, one NISAR geometry each, over the A box from
      2026-06-01 to 2026-10-08, on the NISAR GUNW route (nisar_backend.py,
      PROVISIONAL only): configs/experiments/exp_a5a_appin_nisar_asc167.yaml
