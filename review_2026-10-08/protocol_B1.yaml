  - id: "2026-10-08/nisar-configs"
    date: "2026-10-08"
    kind: "record only: no rule, threshold, station role or radius changes"
    before_any_result: true
    amends: "runs.B5.config, which read 'not written yet (needs M1, M2)'"
    decision: >-
      B5 is five projects, one NISAR geometry and one box each, with the
      window of runs.B5, on the NISAR GUNW route (nisar_backend.py,
      PROVISIONAL only): Corcoran ASC-34
      (configs/experiments/exp_b5a_corcoran_nisar_asc34.yaml) and DES-114
      (exp_b5b_corcoran_nisar_des114.yaml); El Nido-Madera, the box of
      site.nisar_extension, ASC-34 (exp_b5c_elnido_nisar_asc34.yaml), DES-114
      (exp_b5d_elnido_nisar_des114.yaml) and the optional DES-42
      (exp_b5e_elnido_nisar_des42.yaml). The NISAR rows stay exploratory and
      out of the route verdict (comparisons.nisar, verdict.nisar).
    reason: >-
      The configs were written after the protocol was fixed (PLAN phase 3,
      M2). The harness finds a run from its config's file name; a run of
      several projects lists them all.
    harness:
      run_configs:
        B5:
          - configs/experiments/exp_b5a_corcoran_nisar_asc34.yaml
          - configs/experiments/exp_b5b_corcoran_nisar_des114.yaml
          - configs/experiments/exp_b5c_elnido_nisar_asc34.yaml
          - configs/experiments/exp_b5d_elnido_nisar_des114.yaml
          - configs/experiments/exp_b5e_elnido_nisar_des42.yaml

  # ---------------------------------------------------------------------------
  # Amendment of the protocol decisions of 8 Oct 2026 (HANDOFF.md, "8 Oct:
  # validation experiments - phases 2 and 3", decision 5). Kyle delegated the
  # decision; Claude made it for him on 8 Oct 2026, BEFORE any B run had
  # started, any experiment data had been downloaded or any comparison output
  # existed. Nothing above is changed.
  # ---------------------------------------------------------------------------
  - id: "2026-10-08/p23-5"
    date: "2026-10-08"
    decided_by: "Claude for Kyle (delegated 8 Oct)"
    before_any_result: true
    amends: "comparisons.nisar.against_sentinel1: the frame of each of its two statistics ('in Up' as first written)"
    decision: >-
      F4 (python -m insar_pipeline.lband) reports the row's two statistics,
      each in its own frame, always both. (1) "share whose difference lies
      within 5 mm of a non-zero multiple of 27.7 mm (C-band cycle)" - the
      cycle-consistency (aliasing) test - is read in C-band LOS: the NISAR
      change is projected into C-band's LOS under the stated vertical-motion
      assumption (d_C = d_L x up_C / up_L per cell; from D1's L-band Up and
      East when they are given). (2) "share of cells with |difference| < 15
      mm" - the accuracy comparison - is read in vertical: each sensor's LOS
      change divided by cos of its own incidence, both labelled 'assumes
      vertical motion'. The row stays report only and outside the verdict.
    reason: >-
      As first written the row put both statistics "in Up" with a 27.7 mm
      cycle, which mixes two frames: a missed C-band cycle is 27.7 mm only in
      C-band's LOS (about 35 mm in Up at 38 deg incidence), so the aliasing
      fingerprint must be read there, while agreement between two sensors
      with different look sides and incidences is a statement about the
      ground, which this protocol reads in vertical (phase 2/3 decision 5).
      No result existed.
    harness:
      lband_cycle_frame: c_band_los_vertical_motion_assumed
      lband_accuracy_frame: vertical_each_sensor_own_incidence
