# RAiDER's own environment: exact conda-forge pins, exported 24 Oct 2026 from the
# 'raider-env' environment on Kyle's machine, which the HRRR weather route uses
# (mintpy_tropo_method: raider, weather_model: HRRR, raider_env: raider-env;
# weather_raider.py runs RAiDER in it). Herbie comes from pip at 2026.9.2: the
# conda-forge Herbie 2024.8.0 cannot read pre-July-2018 HRRR .idx files with
# pandas 3. The CPU-specific _x86_64-microarch-level pin is left out, as in the
# other environments. Created by install/install.sh.
